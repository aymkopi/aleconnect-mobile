name: Finalize Ticket Push Report Sync

on:
  push:
    branches:
      - feature/ticket-push-report-sync

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ticket-push-report-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch Archive report sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/(tabs)/reports/list.tsx')
          s = path.read_text()

          old = '''import {
  fetchComplaintMeta,
  fetchComplaintReportPage,
  type ComplaintReportSort,
} from "@/services/reports";
import { formatManilaWeekRange, manilaWeekStartKey } from "@/utils/manila-time";'''
          new = '''import {
  fetchComplaintMeta,
  fetchComplaintReportPage,
  type ComplaintReportSort,
} from "@/services/reports";
import {
  subscribeReportRevalidationRequested,
  subscribeReportStatusChanged,
} from "@/services/report-sync-events";
import { formatManilaWeekRange, manilaWeekStartKey } from "@/utils/manila-time";'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  const { session } = useAuthSession();
  const { items: queuedItems, isSyncing, sync, retry, remove } = useReportQueue();'''
          new = '''  const { session } = useAuthSession();
  const userId = session?.user.id;
  const { items: queuedItems, isSyncing, sync, retry, remove } = useReportQueue();'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    async (options?: {
      force?: boolean;
      append?: boolean;
      cursor?: string | null;
    }) => {
      if (!session) return;'''
          new = '''    async (options?: {
      force?: boolean;
      revalidate?: boolean;
      append?: boolean;
      cursor?: string | null;
    }) => {
      if (!userId) return;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''      if (append) setIsLoadingMore(true);
      else if (options?.force) setIsRefreshing(true);
      else setIsLoading(true);'''
          new = '''      if (append) setIsLoadingMore(true);
      else if (options?.force) setIsRefreshing(true);
      else if (!options?.revalidate) setIsLoading(true);'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        const [nextMeta, page] = await Promise.all([
          append ? Promise.resolve(null) : fetchComplaintMeta(options),
          fetchComplaintReportPage({
            userId: session.user.id,
            force: options?.force,
            cursor: options?.cursor,
            query,
            categoryId,
            sort: sortMode,
          }),
        ]);'''
          new = '''        const [nextMeta, page] = await Promise.all([
          append
            ? Promise.resolve(null)
            : fetchComplaintMeta(options?.force ? { force: true } : undefined),
          fetchComplaintReportPage({
            userId,
            force: options?.force,
            revalidate: options?.revalidate,
            cursor: options?.cursor,
            query,
            categoryId,
            sort: sortMode,
          }),
        ]);'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        setNextCursor(page.nextCursor);
        setIsStale(Boolean(page.isStale));
        setError(null);'''
          new = '''        setNextCursor(page.nextCursor);
        setIsStale(Boolean(page.isStale));
        setError(null);
        if (
          page.isStale &&
          !options?.revalidate &&
          !options?.force &&
          !append
        ) {
          queueMicrotask(() => {
            void loadReportsRef.current({ revalidate: true });
          });
        }'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    [categoryId, query, session, sortMode],
  );
  const loadReportsRef = useRef(loadReports);
  useEffect(() => {
    loadReportsRef.current = loadReports;
  }, [loadReports]);'''
          new = '''    [categoryId, query, sortMode, userId],
  );
  const loadReportsRef = useRef(loadReports);
  useEffect(() => {
    loadReportsRef.current = loadReports;
  }, [loadReports]);

  useEffect(() => {
    if (!userId) return;

    const unsubscribeStatus = subscribeReportStatusChanged((event) => {
      if (event.userId !== userId) return;
      setReports((current) =>
        current.map((report) =>
          report.id === event.ticketId
            ? { ...report, status: event.status }
            : report,
        ),
      );
    });

    const unsubscribeRevalidation = subscribeReportRevalidationRequested(
      (changedUserId) => {
        if (changedUserId !== userId) return;
        void loadReportsRef.current({ revalidate: true });
      },
    );

    return () => {
      unsubscribeStatus();
      unsubscribeRevalidation();
    };
  }, [userId]);'''
          assert old in s
          s = s.replace(old, new, 1)

          path.write_text(s)
          PY

      - name: Remove temporary workflow from tested tree
        run: rm .github/workflows/finalize-ticket-push-report-sync.yml

      - run: npm ci

      - name: Focused report sync tests
        run: >-
          node --test
          tests/notification-navigation.test.mjs
          tests/report-sync-ordering.test.mjs
          tests/report-status-cache-sync.test.mjs
          tests/report-sync-events.test.mjs
          tests/report-status-sync-ui.test.mjs

      - name: Full Node suite
        run: node --test tests/*.test.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Harness
        run: npm run harness:check

      - name: Diff check
        run: git diff --check

      - name: Commit exact verified tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/(tabs)/reports/list.tsx' .github/workflows/finalize-ticket-push-report-sync.yml
          git commit -m "feat: sync archive status from ticket pushes"
          git push origin HEAD:feature/ticket-push-report-sync
