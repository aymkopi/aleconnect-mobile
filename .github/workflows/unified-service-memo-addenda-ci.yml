name: Unified Service Memo Addenda CI

on:
  push:
    branches:
      - agent/unify-service-memo-addenda
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify consumer Service Memo updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Validate agent harness and regression tests
        id: harness
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/run-agent-ci.mjs

      - name: Install dependencies
        if: steps.harness.outputs.app_changed == 'true'
        run: npm ci

      - name: Report detail tests
        if: steps.harness.outputs.app_changed == 'true'
        run: node --test tests/report-detail.test.mjs

      - name: TypeScript
        if: steps.harness.outputs.app_changed == 'true'
        run: npx tsc --noEmit

      - name: Lint
        if: steps.harness.outputs.app_changed == 'true'
        run: npm run lint
