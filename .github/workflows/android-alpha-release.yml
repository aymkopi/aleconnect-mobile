name: Android Alpha Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump:
        description: Release impact (auto reads Conventional Commits; alpha keeps the target core)
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha]

permissions:
  contents: read

concurrency:
  group: android-alpha-publication
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/agent-harness.yml

  version:
    needs: checks
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.checks.outputs.app_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      versionCode: ${{ steps.version.outputs.versionCode }}
      ios_needed: ${{ steps.version.outputs.ios_needed }}
      context_artifact: mobile-alpha-version-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Allocate one alpha version for both platforms
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump || 'auto' }}
          RELEASE_INCLUDE_IOS: 'true'
        run: node scripts/release-version.mjs prepare
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.ios_needed == 'true'
        with:
          name: mobile-alpha-version-${{ github.run_attempt }}
          path: |
            app.json
            package.json
            package-lock.json
            release/build-metadata.json
            release/notes.md
          if-no-files-found: error
          retention-days: 3

  ios:
    needs: [checks, version]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.checks.outputs.app_changed == 'true' || github.event_name == 'workflow_dispatch') && needs.version.outputs.ios_needed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ios-usb-ipa.yml
    with:
      release_version: ${{ needs.version.outputs.version }}
      build_number: ${{ needs.version.outputs.versionCode }}
      release_context_artifact: ${{ needs.version.outputs.context_artifact }}

  release:
    needs: [checks, version]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.checks.outputs.app_changed == 'true' || github.event_name == 'workflow_dispatch') && needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ needs.version.outputs.tag }}
    permissions:
      contents: write
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_PANELUI_PREVIEW: '0'
      EXPO_PUBLIC_ALECONNECT_API_URL: https://api.aleconnect.app
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.version.outputs.context_artifact }}
          path: .
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: package-lock.json
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006
      - run: npm ci --include=dev
      - name: APK verifier regression tests
        run: python3 -m unittest discover -s tests -p test_android_apk_verifier.py
      - name: Generate native project with the retained preview signer
        run: |
          npx expo prebuild --platform android --no-install
          echo '221e0a3106aa4c3ccc154e0a418b55020b3f9ea6e84f92e8749cd9e2f39f5e58  android/app/debug.keystore' | sha256sum --check
      - name: Fresh standalone Hermes bundle
        working-directory: android
        run: ./gradlew :app:createBundlePreviewJsAndAssets --rerun-tasks --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Compile ARM64 and x86_64 APK
        working-directory: android
        run: ./gradlew :app:assemblePreview --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify signed APK, manifest, fixture mode and 16 KB alignment
        run: python3 scripts/verify-android-release.py
      - name: Publish immutable GitHub alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-version.mjs publish

  publish-ios:
    needs: [version, release, ios]
    if: always() && needs.version.result == 'success' && needs.ios.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') && needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.ios.outputs.ipa_artifact }}
          path: release/ios
      - name: Attach verified IPA to the matching Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: node scripts/release-version.mjs publish-ios
