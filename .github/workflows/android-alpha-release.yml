name: Android Alpha Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/agent-harness.yml

  release:
    needs: checks
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.checks.outputs.app_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: android-alpha-publication
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_PANELUI_PREVIEW: '0'
      EXPO_PUBLIC_ALECONNECT_API_URL: https://api.aleconnect.app
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: package-lock.json
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006
      - run: npm ci --include=dev
      - name: APK verifier regression tests
        run: python3 -m unittest discover -s tests -p test_android_apk_verifier.py
      - name: Allocate alpha version and Android code
        id: version
        run: node scripts/android-alpha-release.mjs prepare
      - name: Generate native project with the retained preview signer
        run: |
          npx expo prebuild --platform android --no-install
          echo '221e0a3106aa4c3ccc154e0a418b55020b3f9ea6e84f92e8749cd9e2f39f5e58  android/app/debug.keystore' | sha256sum --check
      - name: Fresh standalone Hermes bundle
        working-directory: android
        run: ./gradlew :app:createBundlePreviewJsAndAssets --rerun-tasks --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Compile ARM64 and x86_64 APK
        working-directory: android
        run: ./gradlew :app:assemblePreview --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify signed APK, manifest, fixture mode and 16 KB alignment
        run: python3 scripts/verify-android-release.py
      - name: Publish immutable GitHub alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          APK_FILE: ${{ steps.version.outputs.fileName }}
        run: |
          set -euo pipefail
          cd release
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '[.[].tagName | select(test("^v1\\.0\\.0-alpha\\.[0-9]+$")) | split(".")[-1] | tonumber] | max // 0')
          if [ "$newest" -gt "${RELEASE_TAG##*.}" ]; then
            echo 'A newer alpha is already published; skip this older run.'
            exit 0
          fi
          cat > notes.md <<EOF
          Standalone ALEConnect Android alpha ${RELEASE_VERSION}, built from ${GITHUB_SHA}.

          Includes the current merged app changes, configured for https://api.aleconnect.app with fixture mode disabled. Download the APK and verify SHA256SUMS. Android 7/API24+ on ARM64 phones and x86_64 emulators is supported. Package and original preview certificate are retained, and the Android code increases for in-place updates.

          build-metadata.json records source, version, hash, signer and verification. ZIP/native16KB alignment and the non-debuggable standalone runtime passed. Real-device/private API/push/iOS acceptance and production store signing remain separate.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > existing.json 2> /dev/null; then
            if [ "$(jq -r .isDraft existing.json)" = false ]; then
              echo 'Published release already exists; preserve immutable assets.'
              exit 0
            fi
            echo 'Existing draft requires inspection; refuse to overwrite its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$APK_FILE" SHA256SUMS build-metadata.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --draft --title "ALEConnect ${RELEASE_VERSION}" --notes-file notes.md
          expected=$(sha256sum "$APK_FILE" | cut -d ' ' -f 1)
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"$RELEASE_TAG\") | .assets[] | select(.name==\"$APK_FILE\") | .digest" > uploaded-digest.txt
          test "$(cat uploaded-digest.txt)" = "sha256:$expected"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
