name: Finalize Offline Notification Settings

on:
  push:
    branches:
      - feature/notification-settings-offline-cache

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final offline cache refinement
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src/app/(tabs)/profile/push-notifications.tsx")
          source = path.read_text()

          old_import = '''  fetchNotificationSettings,
            saveNotificationSettings,'''
          new_import = '''  fetchNotificationSettings,
            readCachedNotificationSettings,
            saveNotificationSettings,'''
          if old_import not in source:
              raise SystemExit("notification settings import block not found")
          source = source.replace(old_import, new_import, 1)

          old_load = '''  const load = useCallback(async () => {
            if (!session) {
              setIsLoading(false);
              return;
            }

            setHasHydrated(false);
            const next = await fetchNotificationSettings(session.user.id);
            const selected = makeInitialSelection(next);
            const receivePush = next.preferences.receivePushNotifications;
            const receiveAdvisoriesNext = next.preferences.receiveAdvisories;
            savedSignatureRef.current = JSON.stringify(
              buildSavePayload(next, selected, receivePush, receiveAdvisoriesNext),
            );
            setSettings(next);
            setReceivePushNotifications(receivePush);
            setReceiveAdvisories(receiveAdvisoriesNext);
            setSelectedFeederIds(selected);
            setExpandedSubstationIds(
              new Set(next.substations.map((substation) => substation.id)),
            );
            setIsUsingCachedSettings(Boolean(next.isStale));
            setNotice(null);
            setHasHydrated(true);
            setIsLoading(false);
          }, [session]);'''

          new_load = '''  const load = useCallback(async () => {
            if (!session) {
              setIsLoading(false);
              return;
            }

            const applySettings = (next: NotificationSettings & { isStale?: boolean }) => {
              const selected = makeInitialSelection(next);
              const receivePush = next.preferences.receivePushNotifications;
              const receiveAdvisoriesNext = next.preferences.receiveAdvisories;

              savedSignatureRef.current = JSON.stringify(
                buildSavePayload(next, selected, receivePush, receiveAdvisoriesNext),
              );
              setSettings(next);
              setReceivePushNotifications(receivePush);
              setReceiveAdvisories(receiveAdvisoriesNext);
              setSelectedFeederIds(selected);
              setExpandedSubstationIds(
                new Set(next.substations.map((substation) => substation.id)),
              );
              setIsUsingCachedSettings(Boolean(next.isStale));
              setNotice(null);
              setHasHydrated(true);
              setIsLoading(false);
            };

            setHasHydrated(false);

            const networkState = await NetInfo.fetch();
            const offline =
              networkState.isConnected === false ||
              networkState.isInternetReachable === false;

            setIsNetworkKnown(true);
            setIsOffline(offline);

            if (offline) {
              const cached = await readCachedNotificationSettings(session.user.id);
              if (!cached) {
                throw new Error(
                  "Connect to the internet to load notification settings for the first time.",
                );
              }

              applySettings(cached);
              return;
            }

            const next = await fetchNotificationSettings(session.user.id);
            applySettings(next);
          }, [session]);'''

          if old_load not in source:
              raise SystemExit("notification settings load block not found")
          source = source.replace(old_load, new_load, 1)
          path.write_text(source)
          PY

          # Remove this temporary workflow before verification so the tested tree
          # is exactly the tree that will be committed and pushed.
          rm .github/workflows/offline-cache-finalize.yml

      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/(tabs)/profile/push-notifications.tsx" .github/workflows/offline-cache-finalize.yml
          git commit -m "fix: hydrate notification settings cache immediately offline"
          git push origin HEAD:feature/notification-settings-offline-cache
