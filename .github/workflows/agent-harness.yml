name: Validate Agent Harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run harness:check -- --base HEAD~1
      - run: node --test tests/*.test.mjs
      - run: npx tsc --noEmit
      - run: npm run lint
