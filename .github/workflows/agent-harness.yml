name: Validate Agent Harness

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - name: Validate agent harness and regression tests
        id: harness
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/run-agent-ci.mjs
      - name: Set up dependency cache
        if: steps.harness.outputs.app_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm
      - name: Install dependencies
        if: steps.harness.outputs.app_changed == 'true'
        run: npm ci
      - name: App tests
        if: steps.harness.outputs.app_changed == 'true'
        run: npm run test
      - name: TypeScript
        if: steps.harness.outputs.app_changed == 'true'
        run: npm run typecheck
      - name: Lint
        if: steps.harness.outputs.app_changed == 'true'
        run: npm run lint
